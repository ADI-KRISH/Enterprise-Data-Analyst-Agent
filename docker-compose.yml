services:
  db:
    image: postgres:16
    container_name: eda_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run once, in lexical order, on an empty data volume.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/roles.sql:/opt/roles.sql:ro
      - ./database/roles.sh:/docker-entrypoint-initdb.d/02_roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  api:
    build: .
    profiles: ["app"]
    env_file: .env
    environment:
      # inside the compose network the DB host is `db`, not localhost
      DATABASE_URL_RO: postgresql+psycopg://analyst_ro:${ANALYST_RO_PASSWORD}@db:5432/${POSTGRES_DB:-analytics}
      CHROMA_DIR: /data/chroma
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - chroma:/data/chroma

  dashboard:
    build: .
    profiles: ["app"]
    command: ["streamlit", "run", "dashboard/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  pgdata:
  chroma:
